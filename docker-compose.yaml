services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    env_file: ./Backend/.env
    environment:
      - ENV=production
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped